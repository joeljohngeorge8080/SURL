# nginx site for SURL. bootstrap.sh substitutes __DOMAIN__ and __PORT__, then
# certbot --nginx adds the HTTPS server block and the HTTP->HTTPS redirect.
limit_req_zone $binary_remote_addr zone=surl_scan:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 5m;   # image uploads for OCR

    # Scans drive a real browser and can take a while.
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    # Overwrite (not append) X-Forwarded-For so clients cannot spoof their IP for
    # the app's rate limiter; the app trusts it when TRUST_PROXY_HEADERS=True.
    # (Inherited by both locations below: neither sets its own proxy_set_header.)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rate-limit only the expensive scan endpoints. Limiting location / as well
    # made one ordinary page view (HTML, images, screenshots) spend the burst and
    # 503 the scan that followed.
    location ~ ^/(scan|scan-selected|scan-dynamic|scan-image)$ {
        limit_req zone=surl_scan burst=10 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
    }
}
