# nginx site for SURL. bootstrap.sh substitutes __DOMAIN__ and __PORT__, then
# certbot --nginx adds the HTTPS server block and the HTTP->HTTPS redirect.
limit_req_zone $binary_remote_addr zone=surl_scan:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 5m;   # image uploads for OCR

    # Scans drive a real browser and can take a while.
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    location / {
        limit_req zone=surl_scan burst=10 nodelay;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so clients cannot spoof their IP for the app's
        # rate limiter; the app trusts this header when TRUST_PROXY_HEADERS=True.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
