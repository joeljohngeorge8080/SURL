name: SURL CI/CD

on:
  push:
    branches: [main, master, deploy]
  pull_request:
    branches: [main, master, deploy]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  # ──────────────────────────────────────────────────
  # 1. Lint
  # ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        # Pinned: an unpinned ruff pulls new default rules and breaks CI without a code change.
        run: pip install ruff==0.8.6

      - name: Run Ruff
        run: ruff check . --ignore=E501

  # ──────────────────────────────────────────────────
  # 2. Test
  # ──────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
          playwright install chromium
          playwright install-deps chromium

      - name: Run tests
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          URLHAUS_API_KEY: ${{ secrets.URLHAUS_API_KEY }}
          DEBUG: "False"
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────
  # 3. Build Docker image (and push on main/master)
  # ──────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/deploy')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: surl-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container starts and /health answers)
        run: |
          docker run -d --name smoke -p 8000:8000 surl-smoke:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

      # The deploy branch publishes :deploy, which the EC2 host pulls and runs.
      # main/master keep publishing :latest. Every push also gets a :<sha> tag.
      - name: Compute tags
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          BASE=ghcr.io/$OWNER/${{ env.IMAGE_NAME }}
          if [ "${{ github.ref_name }}" = "deploy" ]; then MAIN=deploy; else MAIN=latest; fi
          echo "TAGS=$BASE:$MAIN,$BASE:${{ github.sha }}" >> $GITHUB_ENV

      - name: Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha
