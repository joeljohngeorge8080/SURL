<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Outer Cyber Ring -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4,6" opacity="0.6"/>

  <!-- Glowing Shield Contour -->
  <path d="M64 16 L100 32 V68 C100 88 84 104 64 112 C44 104 28 88 28 68 V32 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Padlock / S Core -->
  <rect x="48" y="58" width="32" height="26" rx="6" fill="url(#shieldGrad)" />
  <path d="M54 58 V48 C54 42.48 58.48 38 64 38 C69.52 38 74 42.48 74 48 V58" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="4.5" 
        stroke-linecap="round"/>

  <!-- Keyhole / Sensor Dot -->
  <circle cx="64" cy="68" r="3.5" fill="#0f172a"/>
  <path d="M62.5 69 L65.5 69 L66.5 76 L61.5 76 Z" fill="#0f172a"/>

  <!-- Cyber Accents -->
  <circle cx="64" cy="22" r="2.5" fill="#06b6d4"/>
  <circle cx="28" cy="68" r="2.5" fill="#a855f7"/>
  <circle cx="100" cy="68" r="2.5" fill="#a855f7"/>
  <circle cx="64" cy="106" r="2.5" fill="#ec4899"/>
</svg>
